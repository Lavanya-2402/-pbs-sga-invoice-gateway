      const overlay = document.getElementById('mail-api-overlay');
      if (overlay) {
        overlay.classList.toggle('hidden');
      }
    }

    window.addEventListener('click', function(e) {
      const overlay = document.getElementById('mail-api-overlay');
      if (overlay && !overlay.classList.contains('hidden')) {
        const button = overlay.previousElementSibling;
        if (!overlay.contains(e.target) && !button.contains(e.target)) {
          overlay.classList.add('hidden');
        }
      }
    });

    function selectUserProfile(name, role) {
      selectedLoginUser = name;
      selectedLoginRole = role;
      
      const johnBtn = document.getElementById('user-btn-john');
      const aliceBtn = document.getElementById('user-btn-alice');
      const johnChk = document.getElementById('user-check-john');

    function performLogin() {
      currentUser = {
        name: selectedLoginUser,
        role: selectedLoginRole,
        initials: selectedLoginUser === "John Doe" ? "JD" : "AS"
      };

      document.getElementById('login-view').classList.add('hidden');
      document.getElementById('dashboard-view').classList.remove('hidden');

      document.getElementById('header-user-name').innerText = currentUser.name;
      document.getElementById('header-user-role').innerText = currentUser.role + " Specialist";
      document.getElementById('header-user-avatar').innerText = currentUser.initials;
      
      if (currentUser.initials === "JD") {
        document.getElementById('header-user-avatar').className = "h-9 w-9 rounded-full bg-blue-600 flex items-center justify-center font-bold text-white text-xs border border-slate-200 shadow-sm";
      } else {
        document.getElementById('header-user-avatar').className = "h-9 w-9 rounded-full bg-purple-600 flex items-center justify-center font-bold text-white text-xs border border-slate-200 shadow-sm";
      }

      mockLogs.unshift({
        timestamp: new Date().toLocaleString(),
        event: "User Logged In",
        actor: currentUser.name,
        details: "Access granted to Staging Portal."
      });

      showToast(`Welcome back, ${currentUser.name}`, "success");
      switchView('dashboard');
    }

    function performLogout() {
      mockLogs.unshift({
        timestamp: new Date().toLocaleString(),
        event: "User Logged Out",
        actor: currentUser.name,
        details: "User logged out of active session."
      });

      currentUser = null;
      document.getElementById('dashboard-view').classList.add('hidden');
      document.getElementById('login-view').classList.remove('hidden');
      showToast("Signed out of session", "info");
    }

      const flagBadge = document.getElementById('flag-badge');
      
      const activeCount = mockInvoices.filter(i => i.status !== "Synced to SAP").length;
      const myTasksCount = mockInvoices.filter(i => i.status !== "Synced to SAP" && i.owner === currentUser.name).length;
      const compCount = mockInvoices.filter(i => i.status === "Synced to SAP").length;
      const flagsCount = mockInvoices.filter(inv => inv.status !== "Synced to SAP" && (inv.grStatus === 'MISMATCH' || inv.grStatus === 'NO_GR')).length;
      
      if (completedBadge) completedBadge.innerText = 185 + compCount;
      if (totalBadge) totalBadge.innerText = activeCount;
      if (myTasksBadge) myTasksBadge.innerText = myTasksCount;
      if (flagBadge) flagBadge.innerText = flagsCount;

      lucide.createIcons();
    }

    // 3. QUEUE FILTERING ENGINE
    function getQueueList() {
      let list = [];
      if (currentView === 'active') {
        list = mockInvoices.filter(inv => inv.status !== "Synced to SAP");
      } else if (currentView === 'tasks') {
        list = mockInvoices.filter(inv => inv.status !== "Synced to SAP" && inv.owner === currentUser.name);
      } else if (currentView === 'flags') {
        list = mockInvoices.filter(inv => inv.status !== "Synced to SAP" && (inv.grStatus === 'MISMATCH' || inv.grStatus === 'NO_GR'));
      }

      if (searchQuery.trim() !== '') {
        const query = searchQuery.toLowerCase();
        list = list.filter(inv => 
          inv.vendor.toLowerCase().includes(query) ||
          inv.poNumber.toLowerCase().includes(query) ||
          inv.invoiceNumber.toLowerCase().includes(query) ||
          inv.subject.toLowerCase().includes(query)
        );
      }

      if ((currentView === 'active' || currentView === 'tasks') && currentFilter === 'urgent') {
        list = list.filter(inv => inv.urgent);
      }

      return list;
    }

    function renderQueue() {
      const listContainer = document.getElementById('inbox-list');
      if (!listContainer) return;
      listContainer.innerHTML = '';
      
      const list = getQueueList();

      const statsActive = document.getElementById('stats-active-count');
      if (statsActive) {
        statsActive.innerText = `${mockInvoices.filter(i => i.status !== "Synced to SAP").length} Inbound`;
      }
      
      const totalBadge = document.getElementById('total-badge');
      if (totalBadge) totalBadge.innerText = mockInvoices.filter(i => i.status !== "Synced to SAP").length;

      const flags = mockInvoices.filter(inv => inv.status !== "Synced to SAP" && (inv.grStatus === 'MISMATCH' || inv.grStatus === 'NO_GR')).length;

              <div class="space-y-2">

                <div class="flex items-center justify-between border-t border-slate-100 pt-2.5">

                    <span class="h-2 w-2 rounded-full ${grDot}"></span>
                    <span class="text-[10px] ${inv.owner === 'Unassigned' ? 'text-amber-600 font-bold' : 'text-slate-900 font-semibold'} flex items-center gap-1 truncate max-w-[130px]">

        } else {

          listContainer.innerHTML += `

                <div class="flex items-start justify-between">
                  <span class="text-[11px] text-[#005A9C] font-extrabold uppercase tracking-wider truncate max-w-[190px]">${inv.vendor}</span>

                  <div class="flex items-center gap-2">
                    <span class="h-2 w-2 rounded-full ${grDot}"></span>
                    <span class="text-[10px] ${inv.owner === 'Unassigned' ? 'text-amber-600 font-bold' : 'text-slate-900 font-semibold'} flex items-center gap-1 truncate max-w-[130px]">

                    ${lockIndicator}
                    ${urgentBadge}
                  </div>
                </div>
              </div>
            </div>
          `;

      });

      lucide.createIcons();
    }

    function claimInvoiceDirectly(id) {
      const inv = mockInvoices.find(item => item.id === id);
      if (inv && currentUser) {
        inv.owner = currentUser.name;
        mockLogs.unshift({
          timestamp: new Date().toLocaleString(),
          event: "Owner Claimed",
          actor: currentUser.name,
          details: `Invoice ID ${inv.id} claimed directly from Active Queue.`
        });
        showToast("Task claimed successfully! It is now in your 'My Tasks' queue.", "success");
        renderQueue();
      }
    }

    // 4. FILTER QUEUE
    function setQueueFilter(filterVal) {
      currentFilter = filterVal;
      
      const allBtn = document.getElementById('filter-btn-all');
      const urgentBtn = document.getElementById('filter-btn-urgent');
      
      if (!allBtn || !urgentBtn) return;

      if (filterVal === 'all') {
        allBtn.className = "px-3.5 py-1.5 rounded-lg bg-white text-[#005A9C] border border-white text-xs font-bold uppercase transition shadow-sm";
        urgentBtn.className = "px-3.5 py-1.5 rounded-lg bg-transparent text-white border border-white/20 hover:bg-white/10 text-xs font-bold uppercase transition flex items-center gap-1 shadow-sm";
      } else {
        allBtn.className = "px-3.5 py-1.5 rounded-lg bg-transparent text-white border border-white/20 hover:bg-white/10 text-xs font-bold uppercase transition shadow-sm";
        urgentBtn.className = "px-3.5 py-1.5 rounded-lg bg-red-600 text-white border border-red-500/10 text-xs font-bold uppercase transition flex items-center gap-1 shadow-sm";
      }

      renderQueue();
    }

    function filterQueueBySearch() {
      const search = document.getElementById('search-input');
      if (search) searchQuery = search.value;
      renderQueue();
    }

    function openInvoiceDetailsView() {
      const listContainer = document.getElementById('queue-list-container');
      const detailsContainer = document.getElementById('queue-details-container');
      if (listContainer && detailsContainer) {
        listContainer.classList.add('hidden');
        detailsContainer.classList.remove('hidden');
        detailsContainer.scrollTop = 0;
        lucide.createIcons();
      }
    }

    function goBackToQueueList() {
      const listContainer = document.getElementById('queue-list-container');
      const detailsContainer = document.getElementById('queue-details-container');
      if (listContainer && detailsContainer) {
        detailsContainer.classList.add('hidden');
        listContainer.classList.remove('hidden');
        selectedInvoiceId = null;
        renderQueue();
      }
    }

    // Helper to open/close details modal (Redirected to inline view)
    function openInvoiceModal() {
      openInvoiceDetailsView();
    }

    function closeInvoiceModal() {
      goBackToQueueList();
    }

    // 5. SELECTED INVOICE DETAILS DISPLAY
    function selectInvoice(id) {
      selectedInvoiceId = id;
      const inv = mockInvoices.find(item => item.id === id);
      if (!inv) return;

      const vendor = document.getElementById('selected-vendor');
      const subject = document.getElementById('selected-subject');
      const received = document.getElementById('selected-received');
      const confidence = document.getElementById('selected-confidence');
      
      if (vendor) vendor.innerText = inv.vendor;
      if (subject) subject.innerText = inv.subject;
      if (received) received.innerText = inv.received;
      if (confidence) confidence.innerText = inv.confidence;
      
      const filename = document.getElementById('selected-filename');
      const filesize = document.getElementById('selected-filesize');
      if (filename) filename.innerText = inv.filename;
      if (filesize) filesize.innerText = inv.filesize;

      const emailFrom = document.getElementById('email-from');
      const emailBody = document.getElementById('email-body');
      if (emailFrom) emailFrom.innerText = inv.emailFrom;
      if (emailBody) emailBody.innerHTML = inv.emailBody.replace(/\n/g, '<br>');

      const banner = document.getElementById('urgent-banner');
      if (banner) {
        if (inv.urgent) {
          banner.classList.remove('hidden');
        } else {
          banner.classList.add('hidden');
        }
      }

      const loader = document.getElementById('processing-loader');
      if (loader) loader.classList.add('hidden');

      renderLockControlCard(inv);
      renderAIFieldsContainer(inv); 
      renderSAPMatchingPanel(inv);
      renderQueue();

      openInvoiceModal();
    }

      if (!container) return;

      const isMyInvoice = inv.owner === currentUser.name;

      if (isMyInvoice) {

          <div class="bg-white p-3 rounded-xl border border-blue-200 premium-shadow space-y-1.5">
            <label class="text-[9px] text-[#005A9C] uppercase font-bold tracking-wider block">✏️ Extracted PO Number</label>
            <input type="text" value="${inv.poNumber}" oninput="updateInvoiceField('poNumber', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 text-xs text-slate-900 font-bold font-mono focus:outline-none focus:border-blue-500 focus:bg-white">

            <input type="text" value="${inv.invoiceNumber}" oninput="updateInvoiceField('invoiceNumber', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 text-xs text-slate-900 font-bold font-mono focus:outline-none focus:border-blue-500 focus:bg-white">
          </div>
          <div class="bg-white p-3 rounded-xl border border-blue-200 premium-shadow space-y-1.5">

          </div>
          <div class="bg-white p-3 rounded-xl border border-blue-200 premium-shadow space-y-1.5">
            <label class="text-[9px] text-[#005A9C] uppercase font-bold tracking-wider block">✏️ Total Amount</label>
            <input type="text" value="${inv.amount}" oninput="updateInvoiceField('amount', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded px-2.5 py-1.5 text-xs text-slate-900 font-bold font-mono focus:outline-none focus:border-blue-500 focus:bg-white">
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 premium-shadow space-y-1">
            <label class="text-[9px] text-[#005A9C] uppercase font-bold tracking-wider block">Extracted PO Number</label>
            <span class="text-xs font-bold text-slate-900 font-mono" id="field-po">${inv.poNumber}</span>
          </div>
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 premium-shadow space-y-1">
            <label class="text-[9px] text-[#005A9C] uppercase font-bold tracking-wider block">Invoice Number</label>
            <span class="text-xs font-bold text-slate-900 font-mono" id="field-inv-num">${inv.invoiceNumber}</span>
          </div>
          <div class="bg-white p-3.5 rounded-xl border border-slate-200 premium-shadow space-y-1">
            <label class="text-[9px] text-[#005A9C] uppercase font-bold tracking-wider block">Invoice Date</label>
            <span class="text-xs font-bold text-slate-900 font-mono" id="field-inv-date">${inv.invoiceDate}</span>

            <label class="text-[9px] text-[#005A9C] uppercase font-bold tracking-wider block">Total Amount</label>
            <span class="text-base font-black text-slate-900 font-mono" id="field-amount">${inv.amount}</span>
          </div>
        `;
      }
    }

    function updateInvoiceField(fieldKey, value) {
      const inv = mockInvoices.find(item => item.id === selectedInvoiceId);
      if (inv) {
        inv[fieldKey] = value;
        renderQueue();
      }
    }

    function renderLockControlCard(inv) {
      const lockBanner = document.getElementById('lock-banner');
      if (!lockBanner) return;
      
      const isLockedByOther = inv.owner !== "Unassigned" && inv.owner !== currentUser.name;

      if (inv.owner === "Unassigned") {
        lockBanner.className = "bg-amber-50/50 p-4 rounded-xl border border-amber-200 text-amber-800 flex items-center justify-between";
        lockBanner.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="h-8 w-8 bg-amber-100 text-amber-850 rounded-full flex items-center justify-center">

            </div>
            <div>
              <p class="text-xs font-bold text-[#005A9C]">Invoice Task is Unassigned</p>
              <p class="text-[10px] text-slate-900 font-semibold">Claim to enable editing of extracted details and SAP actions.</p>
            </div>
          </div>
          <button onclick="claimInvoice('${inv.id}')" class="bg-[#005A9C] hover:bg-[#004e87] text-white text-2xs font-bold py-1.5 px-3.5 rounded-lg transition flex items-center gap-1.5 shadow-sm">
            <i data-lucide="user-check" class="w-3.5 h-3.5"></i> Claim Ownership
          </button>

          <div class="flex items-center gap-3">

            </div>
            <div>
              <p class="text-xs font-bold text-red-700">🔒 Locked by ${inv.owner}</p>
              <p class="text-[10px] text-slate-900 font-semibold">Locked to prevent duplicate actions. Read-only view.</p>
            </div>
          </div>
          <div class="text-[10px] text-red-600 font-bold uppercase tracking-wider font-mono">Protected</div>
        `;
      } else {
        const initials = currentUser.initials;
        const color = initials === 'JD' ? 'bg-blue-600' : 'bg-purple-600';
        lockBanner.className = "bg-blue-50/50 p-4 rounded-xl border border-blue-200 text-blue-800 flex items-center justify-between";
        lockBanner.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="h-8 w-8 ${color} rounded-full flex items-center justify-center font-bold text-xs text-white">${initials}</div>

              <p class="text-xs font-bold text-[#005A9C]">Assigned to You</p>
              <p class="text-[10px] text-slate-900 font-semibold">Lock active. You can now edit extraction fields below.</p>
            </div>
          </div>
          <button onclick="unclaimInvoice('${inv.id}')" class="bg-white hover:bg-slate-50 text-slate-700 text-2xs font-semibold py-1.5 px-3.5 rounded-lg transition flex items-center gap-1.5 border border-slate-200 shadow-sm">
            <i data-lucide="user-minus" class="w-3.5 h-3.5 text-slate-400"></i> Unassign Task
          </button>
        `;
      }
      lucide.createIcons();
    }

    function claimInvoice(id) {
      const inv = mockInvoices.find(item => item.id === id);
      if (inv) {
        inv.owner = currentUser.name;
        mockLogs.unshift({
          timestamp: new Date().toLocaleString(),
          event: "Owner Claimed",
          actor: currentUser.name,
          details: `Invoice ID ${inv.id} claimed from queue.`
        });
        showToast("You have claimed ownership. Fields are now editable.", "success");
        selectInvoice(id);
      }
    }

    function unclaimInvoice(id) {
      const inv = mockInvoices.find(item => item.id === id);
      if (inv) {
        const prevOwner = inv.owner;
        inv.owner = "Unassigned";
        mockLogs.unshift({
          timestamp: new Date().toLocaleString(),
          event: "Owner Unassigned",
          actor: currentUser.name,
          details: `Invoice ID ${inv.id} released by ${prevOwner}.`
        });
        showToast("Invoice unassigned.", "info");
        selectInvoice(id);
      }
    }

    function renderSAPMatchingPanel(inv) {
      const valPanel = document.getElementById('validation-panel');
      const actionControls = document.getElementById('btn-group-wrapper');
      if (!valPanel || !actionControls) return;
      
      const isLockedByOther = inv.owner !== "Unassigned" && inv.owner !== currentUser.name;

      let grClass = '';
      let grBadge = '';
      let grDetailText = inv.grDetails;
      
      if (inv.grStatus === 'MATCHED') {
        grClass = 'border-emerald-200 bg-emerald-50';
        grBadge = `<div class="flex items-center gap-2 text-emerald-800 font-bold text-xs"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-600"></i>SAP Goods Receipt Verified</div>`;
      } else if (inv.grStatus === 'MISMATCH') {
        grClass = 'border-amber-200 bg-amber-50';
        grBadge = `<div class="flex items-center gap-2 text-amber-850 font-bold text-xs"><i data-lucide="alert-circle" class="w-4 h-4 text-amber-600"></i>GR Amount Mismatch Alert</div>`;
      } else { 
        grClass = 'border-red-200 bg-red-50';
        grBadge = `<div class="flex items-center gap-2 text-red-800 font-bold text-xs"><i data-lucide="x-circle" class="w-4 h-4 text-red-605"></i>No Goods Receipt Found</div>`;
      }

      let refreshButtonHTML = '';
      if (inv.grStatus === 'NO_GR' || inv.grStatus === 'MISMATCH') {
        const disabledAttr = isLockedByOther ? 'disabled style="opacity: 0.5; cursor: not-allowed;"' : '';
        refreshButtonHTML = `
          <button onclick="refreshSAPStatus('${inv.id}')" ${disabledAttr} class="mt-2 text-2xs bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 font-bold py-1.5 px-3 rounded-lg transition flex items-center gap-1.5 self-start shadow-sm">
            <i data-lucide="refresh-cw" class="w-3.5 h-3.5 text-blue-600"></i> 
            <span>Query SAP for Goods Receipt (Refresh)</span>
          </button>
        `;
      }

      valPanel.className = `p-4 rounded-xl border flex flex-col gap-2.5 ${grClass}`;
      valPanel.innerHTML = `
        <div class="flex justify-between items-center">
          ${grBadge}
          <span class="text-[10px] text-[#005A9C] font-extrabold font-mono">SAP SYS: PRD_200</span>
        </div>
        <p class="text-2xs leading-relaxed font-mono font-bold text-slate-900">${grDetailText}</p>
        ${refreshButtonHTML}
      `;

      if (isLockedByOther) {
        actionControls.innerHTML = `
          <div class="bg-red-50 rounded-xl p-3 border border-red-100 text-center flex-1">
            <p class="text-2xs text-red-800 font-bold flex items-center justify-center gap-1.5"><i data-lucide="lock" class="w-3.5 h-3.5 text-red-600"></i> Locked by ${inv.owner}</p>
          </div>
          <button disabled class="flex-1 bg-slate-100 text-slate-400 font-bold py-2.5 px-4 rounded-lg text-xs cursor-not-allowed flex items-center justify-center gap-2"><i data-lucide="shield-alert" class="w-4 h-4"></i> Approve & Sync to SAP Workflow</button>
        `;
      } else if (inv.owner === "Unassigned") {
        actionControls.innerHTML = `
          <div class="bg-amber-50 rounded-xl p-3 border border-amber-100 flex items-center gap-2 flex-1">
            <p class="text-2xs text-slate-900 font-semibold"><strong class="text-[#005A9C]">Task Unassigned:</strong> Claim task to enable actions.</p>
          </div>
          <button onclick="claimInvoice('${inv.id}')" class="bg-white hover:bg-slate-100 text-[#005A9C] font-bold py-2.5 px-6 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-md"><i data-lucide="user-plus" class="w-4 h-4 text-[#005A9C]"></i> Claim & Enable Controls</button>
        `;
      } else {
        const isMatched = inv.grStatus === "MATCHED";
        let approveButton = isMatched
          ? `<button onclick="approveInvoice('${inv.id}')" class="flex-1 bg-white hover:bg-slate-100 text-[#005A9C] font-bold py-2.5 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-md"><i data-lucide="check-circle" class="w-4 h-4 text-[#005A9C]"></i> Approve & Sync to SAP Workflow</button>`
          : `<button disabled class="flex-1 bg-slate-100 text-slate-400 border border-slate-200 font-semibold py-2.5 px-4 rounded-lg text-xs cursor-not-allowed flex items-center justify-center gap-2"><i data-lucide="shield-alert" class="w-4 h-4 text-slate-400"></i> Approve & Sync (Block: GR Mismatch)</button>`;

        actionControls.innerHTML = `
          ${approveButton}
          <button onclick="flagInvoice('${inv.id}')" class="flex-1 bg-transparent hover:bg-white/10 border border-white/30 text-white font-bold py-2 px-4 rounded-lg text-xs transition flex items-center justify-center gap-2 shadow-sm">
            <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400"></i> Flag Exception / Escalation
          </button>
        `;
      }
      lucide.createIcons();
    }

    function refreshSAPStatus(id) {
      const inv = mockInvoices.find(item => item.id === id);
      if (!inv) return;

      const valPanel = document.getElementById('validation-panel');
      if (!valPanel) return;

      valPanel.className = `p-4 rounded-xl border border-blue-200 bg-blue-50 text-blue-800`;
      valPanel.innerHTML = `
        <div class="flex items-center gap-3 py-1">
          <svg class="animate-spin h-4 w-4 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
          <div class="text-xs font-bold font-sans text-slate-800">Querying SAP System PRD_200 (RFC check)...</div>
        </div>
      `;

      setTimeout(() => {
        inv.grStatus = "MATCHED";
        if (id === "sga-102") {
          inv.grDetails = "Goods Receipt GR-800312 created at 12:05 PM by HQ Site Manager (15 Office Supply Packs). Matches invoice amount of $850.50.";
        } else if (id === "sga-101") {
          inv.grDetails = "Purchase Order Adjustment posted. Goods Receipt GR-800299 updated. Invoice matches adjusted amount of $18,250.00.";
        }

        mockLogs.unshift({
          timestamp: new Date().toLocaleString(),
          event: "SAP DB Sync Update",
          actor: "System (RFC)",
          details: `Manual request matched Goods Receipt in SAP for PO associated with invoice ID ${inv.id}.`
        });

        showToast("SAP DB Sync: Matching Goods Receipt found and updated!", "success");
        selectInvoice(id);
      }, 1500);
    }

    function approveInvoice(id) {
      const inv = mockInvoices.find(item => item.id === id);
      if (!inv) return;

      const wrapper = document.getElementById('btn-group-wrapper');
      const loader = document.getElementById('processing-loader');
      
      if (wrapper) wrapper.innerHTML = '';
      if (loader) loader.classList.remove('hidden');

      const chk1 = document.getElementById('chk-status-1');
      const chk2 = document.getElementById('chk-status-2');
      const chk3 = document.getElementById('chk-status-3');

      chk1.innerText = "VERIFYING"; chk1.className = "text-amber-600 font-bold";

      setTimeout(() => {
        chk1.innerText = "CONFIRMED"; chk1.className = "text-emerald-600 font-bold";
        chk2.innerText = "CHECKING"; chk2.className = "text-amber-600 font-bold";
      }, 800);

      setTimeout(() => {
        chk2.innerText = "MATCHED"; chk2.className = "text-emerald-600 font-bold";
        chk3.innerText = "UPLOADING"; chk3.className = "text-amber-600 font-bold";
      }, 1600);

      setTimeout(() => {
        chk3.innerText = "INGESTED"; chk3.className = "text-emerald-600 font-bold";
        
        inv.status = "Synced to SAP";
        const docId = `SGA-${new Date().getFullYear()}-${Math.floor(100000 + Math.random() * 900000)}`;
        inv.sapDocId = docId;

        mockLogs.unshift({
          timestamp: new Date().toLocaleString(),
          event: "SAP Ingestion Sync",
          actor: currentUser.name,
          details: `Approved SGA Invoice ID ${inv.id}. SAP Workflow Doc ID: ${docId} created.`
        });

        showToast("Sync Complete! Ingested to SAP Workflow.", "success");
        closeInvoiceModal();
        switchView('active');
      }, 2500);
    }

    function flagInvoice(id) {
      const inv = mockInvoices.find(item => item.id === id);
      if (!inv) return;
      inv.status = "Flagged Exception";
      mockLogs.unshift({
        timestamp: new Date().toLocaleString(),
        event: "Invoice Flagged",
        actor: currentUser.name,
        details: `SGA Invoice ID ${inv.id} flagged for escalation.`
      });
      showToast("Invoice flagged and moved to AP exception review folder.", "warning");
      selectInvoice(inv.id);
    }

    // 6. TABLES RENDERING
    function renderCompletedTable() {
      const tbody = document.getElementById('completed-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      const completed = mockInvoices.filter(i => i.status === "Synced to SAP");

      completed.forEach(inv => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 border-b border-slate-100 transition text-slate-700">
            <td class="p-4 text-emerald-600 font-bold">${inv.sapDocId || 'SGA-2026-881204'}</td>
            <td class="p-4 text-slate-800 font-sans text-xs font-bold">${inv.vendor}</td>
            <td class="p-4">${inv.invoiceNumber}</td>
            <td class="p-4">${inv.poNumber}</td>
            <td class="p-4 text-slate-900 font-bold">${inv.amount}</td>
            <td class="p-4 font-sans text-2xs text-slate-500">${inv.received}</td>
            <td class="p-4 text-slate-600 font-sans text-xs flex items-center gap-1.5"><i data-lucide="user" class="w-3 h-3 text-blue-600"></i> ${inv.owner}</td>
            <td class="p-4 text-center"><span class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-2 py-0.5 rounded text-[10px] font-bold font-sans uppercase">Synced</span></td>
          </tr>
        `;
      });

      tbody.innerHTML += `
        <tr class="hover:bg-slate-50 border-b border-slate-100 transition text-slate-700 opacity-75">
          <td class="p-4 text-emerald-600 font-bold">SGA-2026-102914</td>
          <td class="p-4 text-slate-800 font-sans text-xs font-bold">Office Depot Business Solutions</td>
          <td class="p-4">OD-881001</td>
          <td class="p-4">PO-450097721</td>
          <td class="p-4 text-slate-900 font-bold">$410.20</td>
          <td class="p-4 font-sans text-2xs text-slate-500">2026-05-24 11:15 AM</td>
          <td class="p-4 text-slate-600 font-sans text-xs flex items-center gap-1.5"><i data-lucide="user" class="w-3 h-3 text-blue-600"></i> John Doe</td>
          <td class="p-4 text-center"><span class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-2 py-0.5 rounded text-[10px] font-bold font-sans uppercase">Synced</span></td>
        </tr>
        <tr class="hover:bg-slate-50 border-b border-slate-100 transition text-slate-700 opacity-75">
          <td class="p-4 text-emerald-600 font-bold">SGA-2026-081290</td>
          <td class="p-4 text-slate-800 font-sans text-xs font-bold">Cummins Engine Service</td>
          <td class="p-4">CUM-9912</td>
          <td class="p-4">PO-450098004</td>
          <td class="p-4 text-slate-900 font-bold">$1,450.00</td>
          <td class="p-4 font-sans text-2xs text-slate-500">2026-05-23 04:45 PM</td>
          <td class="p-4 text-slate-600 font-sans text-xs flex items-center gap-1.5"><i data-lucide="user" class="w-3 h-3 text-blue-600"></i> Alice Smith</td>
          <td class="p-4 text-center"><span class="bg-emerald-50 text-emerald-700 border border-emerald-100 px-2 py-0.5 rounded text-[10px] font-bold font-sans uppercase">Synced</span></td>
        </tr>
      `;
      lucide.createIcons();
    }

    function renderAuditTable() {
      const tbody = document.getElementById('audit-table-body');
      if (!tbody) return;
      tbody.innerHTML = '';
      
      mockLogs.forEach(log => {
        tbody.innerHTML += `
          <tr class="hover:bg-slate-50 border-b border-slate-100 transition text-slate-700">
            <td class="p-4 text-slate-500 text-2xs font-bold">${log.timestamp}</td>
            <td class="p-4 font-bold text-xs"><span class="bg-slate-100 border border-slate-200 px-2 py-0.5 rounded text-[#0A2342] font-sans font-bold text-[10px] uppercase">${log.event}</span></td>
            <td class="p-4 text-slate-800 text-xs font-bold font-sans">${log.actor}</td>
            <td class="p-4 text-slate-600 font-sans text-xs font-semibold">${log.details}</td>
          </tr>
        `;
      });
    }

    function updateConfigSlider() {
      const slider = document.getElementById('conf-slider');
      const display = document.getElementById('conf-val');
      if (slider && display) {
        aiConfig.confidenceThreshold = slider.value;
        display.innerText = slider.value + '%';
      }
    }

    function saveAIConfig() {
      const keywords = document.getElementById('config-keywords').value;
      const sync = document.getElementById('config-sync').value;
      const archive = document.getElementById('config-archive').value;

      aiConfig.urgentKeywords = keywords.split(',').map(s => s.trim());
      aiConfig.syncInterval = sync;
      aiConfig.archiveFolder = archive;

      mockLogs.unshift({
        timestamp: new Date().toLocaleString(),
        event: "AI Config Edited",
        actor: currentUser.name,
        details: `Confidence limit updated to ${aiConfig.confidenceThreshold}%. Sync set to ${sync}m.`
      });

      showToast("AI Configurations successfully saved and deployed.", "success");
      switchView('active');
    }

    // 7. SYSTEM TOASTS
    function showToast(message, type = "success") {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `mb-3 p-4 rounded-xl shadow-lg border flex items-center gap-3 transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-auto max-w-sm bg-white border-slate-200 z-50`;
      
      let icon = '';
      if (type === 'success') {
        icon = `<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 shrink-0"></i>`;
      } else if (type === 'warning') {
        icon = `<i data-lucide="alert-triangle" class="w-5 h-5 text-amber-500 shrink-0"></i>`;
      } else if (type === 'error') {
        icon = `<i data-lucide="x-octagon" class="w-5 h-5 text-red-500 shrink-0"></i>`;
      } else {
        icon = `<i data-lucide="info" class="w-5 h-5 text-blue-600 shrink-0"></i>`;
      }

      toast.innerHTML = `
        ${icon}
        <div class="text-xs font-semibold text-slate-700">${message}</div>
      `;

      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('translate-y-4', 'opacity-0');
      }, 50);

      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => {
          toast.remove();
        }, 300);
      }, 5000);

      lucide.createIcons();
    }

    // Initialize icons on page load
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
  <!-- Details modal removed: now rendered inline in workspace-layout -->
</body>
</html>
